appId: com.devbox.app
productName: DevBox
executableName: DevBox
artifactName: DevBox-Setup.${ext}
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: vendor/microsoft-js-debug
    to: vendor/microsoft-js-debug
  - from: specs/development/geliştirme-spec-task-graph.json
    to: development/geliştirme-spec-task-graph.json
  - from: src
    to: development/source-template/src
  - from: config
    to: development/source-template/config
  - from: scripts
    to: development/source-template/scripts
  - from: specs
    to: development/source-template/specs
  - from: tests
    to: development/source-template/tests
  - from: docs
    to: development/source-template/docs
  - from: .github
    to: development/source-template/.github
  - from: build
    to: development/source-template/build
  - from: vendor
    to: development/source-template/vendor
  - from: package.json
    to: development/source-template/package.json
  - from: pnpm-lock.yaml
    to: development/source-template/pnpm-lock.yaml
  - from: pnpm-workspace.yaml
    to: development/source-template/pnpm-workspace.yaml
  - from: tsconfig.json
    to: development/source-template/tsconfig.json
  - from: README.md
    to: development/source-template/README.md
  - from: CHANGELOG.md
    to: development/source-template/CHANGELOG.md
  - from: LICENSE
    to: development/source-template/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: development/source-template/THIRD_PARTY_NOTICES.md
  - from: .gitignore
    to: development/source-template/.gitignore
  - from: .gitattributes
    to: development/source-template/.gitattributes
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
win:
  icon: icon.ico
  target:
    - nsis
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: true
nsis:
  include: installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevBox
  uninstallDisplayName: DevBox
  deleteAppDataOnUninstall: false
