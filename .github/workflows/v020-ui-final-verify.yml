name: DevBox v0.1.20 UI final verification

on:
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization

permissions:
  contents: read

concurrency:
  group: v020-ui-final-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Exact head kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          persist-credentials: false
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: UI ve site bağlantı sözleşmesini doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'FINAL_DIFF_CHECK_FAILED' }
          node --check cloud/devbox-site/app.js
          if ($LASTEXITCODE -ne 0) { throw 'DEVBOX_SITE_APP_SYNTAX_FAILED' }
          node --check cloud/devbox-site/experience-v2.js
          if ($LASTEXITCODE -ne 0) { throw 'DEVBOX_SITE_EXPERIENCE_SYNTAX_FAILED' }
          $app = Get-Content cloud/devbox-site/app.js -Raw
          $experience = Get-Content cloud/devbox-site/experience-v2.js -Raw
          $themeStyle = Get-Content src/renderer/theme-style-v2.ts -Raw
          $settings = Get-Content src/renderer/SettingsWorkspaceV2.tsx -Raw
          $advanced = Get-Content src/renderer/AdvancedViews.tsx -Raw
          $renderer = Get-Content src/renderer/main.tsx -Raw
          if (-not $app.Contains('import "./experience-v2.js";')) { throw 'EXPERIENCE_V2_NOT_CONNECTED' }
          if (-not $experience.Contains('ensureStylesheet("/experience-v2.css")')) { throw 'EXPERIENCE_V2_CSS_NOT_CONNECTED' }
          if ($themeStyle -match '--bg-app|--bg-sidebar|--bg-panel|--border|--text-muted') { throw 'LEGACY_INLINE_SURFACE_OVERRIDE_PRESENT' }
          if (-not $settings.Contains('base: "system"')) { throw 'SYSTEM_THEME_UI_MISSING' }
          if (-not $advanced.Contains('prefers-color-scheme: dark') -or -not $advanced.Contains('terminalIsLight')) { throw 'SYSTEM_TERMINAL_THEME_MISSING' }
          if (-not $renderer.Contains('"./design-system-v2.css"') -or -not $renderer.Contains('"./design-system-v2-components.css"') -or -not $renderer.Contains('"./plugins-skills-v2.css"')) { throw 'DESIGN_V2_LOAD_CHAIN_MISSING' }
          Write-Host 'UI_SITE_CONTRACT_VERIFY_PASS'

      - name: 22 faz ve Evolution gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm spec:verify
          if ($LASTEXITCODE -ne 0) { throw 'SPEC_VERIFY_FAILED' }
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }

      - name: TypeScript test build truth
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }
