name: DevBox v0.1.20 bootstrap credential preflight hardening

on:
  push:
    branches:
      - codex/v0.1.20-vercel-production-modernization
    paths:
      - scripts/patch-v020-bootstrap-preflight.mjs
      - .github/workflows/v020-bootstrap-preflight-materialize.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-v020-bootstrap-preflight.mjs
      - .github/workflows/v020-bootstrap-preflight-materialize.yml

permissions:
  contents: write

concurrency:
  group: v020-bootstrap-preflight-materialize-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Production branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-vercel-production-modernization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Bootstrap preflight patch'ini exact uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/patch-v020-bootstrap-preflight.mjs
          if ($LASTEXITCODE -ne 0) { throw 'BOOTSTRAP_PREFLIGHT_PATCH_FAILED' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/bootstrap-v020-production-secrets.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'BOOTSTRAP_PREFLIGHT_PARSE_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'BOOTSTRAP_PREFLIGHT_DIFF_FAILED' }

      - name: Bootstrap ve ürün kapılarını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'scripts/bootstrap-v020-production-secrets.ps1' -Raw
          foreach ($required in @('Assert-VercelProjectAccess','VERCEL_PREFLIGHT_PASS','Assert-PostgresConnectionUri','DATABASE_PREFLIGHT_PASS','RELEASE_TARGET_PREFLIGHT_PASS')) {
            if (-not $source.Contains($required)) { throw "BOOTSTRAP_PREFLIGHT_RUNTIME_CONTRACT_MISSING:$required" }
          }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }

      - name: Doğrulanmış bootstrap patch'ini branch'e yaz
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- scripts/bootstrap-v020-production-secrets.ps1 .github/workflows/v020-bootstrap-verify.yml
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'fix(release): validate production credentials before secret mutation'
            git push origin HEAD:codex/v0.1.20-vercel-production-modernization
          }
