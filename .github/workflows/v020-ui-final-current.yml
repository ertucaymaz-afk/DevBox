name: DevBox v0.1.20 current UI final verification

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization

permissions:
  contents: read

concurrency:
  group: v020-current-ui-final-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Exact head kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          persist-credentials: false
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: UI runtime sözleşmelerini doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'FINAL_DIFF_CHECK_FAILED' }
          node --check cloud/devbox-site/app.js
          if ($LASTEXITCODE -ne 0) { throw 'DEVBOX_SITE_APP_SYNTAX_FAILED' }
          node --check cloud/devbox-site/experience-v2.js
          if ($LASTEXITCODE -ne 0) { throw 'DEVBOX_SITE_EXPERIENCE_SYNTAX_FAILED' }
          $app = Get-Content src/renderer/App.tsx -Raw
          $advanced = Get-Content src/renderer/AdvancedViews.tsx -Raw
          $main = Get-Content src/renderer/main.tsx -Raw
          $catalog = Get-Content src/renderer/CatalogWorkspaceV2.tsx -Raw
          $catalogState = Get-Content src/renderer/catalog-view-state.ts -Raw
          $settings = Get-Content src/renderer/SettingsWorkspaceV2.tsx -Raw
          $theme = Get-Content src/renderer/theme-style-v2.ts -Raw
          $siteApp = Get-Content cloud/devbox-site/app.js -Raw
          $experience = Get-Content cloud/devbox-site/experience-v2.js -Raw
          if (-not $app.Contains('import { CatalogWorkspaceV2 } from "./CatalogWorkspaceV2";') -or -not $app.Contains('view === "skills" && <CatalogWorkspaceV2 />')) { throw 'CATALOG_V2_ROUTE_MISSING' }
          if ($advanced.Contains('export function CatalogWorkspace') -or $advanced.Contains('CatalogToolRunner')) { throw 'LEGACY_CATALOG_REMAINS' }
          if (-not $main.Contains('"./catalog-v2.css"') -or -not $main.Contains('"./plugins-skills-v2.css"')) { throw 'CATALOG_V2_CSS_CHAIN_MISSING' }
          if (-not $catalog.Contains('catalogCanRunTools(item)') -or -not $catalog.Contains('runCatalogAction("reload"')) { throw 'CATALOG_RUNTIME_GUARD_MISSING' }
          if (-not $catalogState.Contains('return "Kaynak doğrulandı"') -or -not $catalogState.Contains('return "Kaynak bekliyor"') -or -not $catalogState.Contains('catalogSourceVerified(item) && !catalogHasFailure(item)')) { throw 'CATALOG_TRUTH_STATE_MISSING' }
          if (-not $settings.Contains('base: "system"')) { throw 'SYSTEM_THEME_UI_MISSING' }
          if ($theme -match '--bg-app|--bg-sidebar|--bg-panel|--border|--text-muted') { throw 'LEGACY_INLINE_SURFACE_OVERRIDE_PRESENT' }
          if (-not $advanced.Contains('prefers-color-scheme: dark') -or -not $advanced.Contains('terminalIsLight')) { throw 'SYSTEM_TERMINAL_THEME_MISSING' }
          if (-not $siteApp.Contains('import "./experience-v2.js";') -or -not $experience.Contains('ensureStylesheet("/experience-v2.css")')) { throw 'EXPERIENCE_V2_LOAD_CHAIN_MISSING' }
          Write-Host 'V020_CURRENT_UI_RUNTIME_CONTRACT_PASS'

      - name: Evolution ve ürün kapılarını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }
