name: DevBox v0.1.17 hardening
# Final audit runner: patchers are syntax-checked before product verification.

on:
  push:
    branches:
      - codex/v0.1.17-final-runtime-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devbox-v017-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/v0.1.17-final-runtime-hardening')
    runs-on: windows-2025
    steps:
      - name: Branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.17-final-runtime-hardening
          fetch-depth: 1
          persist-credentials: true
      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: v0.1.17 hardening uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchers = @(
            'scripts/apply-v017-v9-forward.mjs',
            'scripts/apply-v017-findings.mjs',
            'scripts/apply-v017-theme-main.mjs',
            'scripts/apply-v017-theme-renderer.mjs',
            'scripts/apply-v017-remix-service.mjs',
            'scripts/apply-v017-remix-ui-tests.mjs'
          )
          foreach ($patcher in $patchers) {
            node --check $patcher
            if ($LASTEXITCODE -ne 0) { throw "V017_PATCHER_SYNTAX_FAILED:$patcher" }
            node $patcher
            if ($LASTEXITCODE -ne 0) { throw "V017_PATCH_FAILED:$patcher" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'V017_DIFF_CHECK_FAILED' }
      - name: Tam ürün doğrulaması
        run: pnpm verify
      - name: Doğrulanmış kaynakları dala yaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'V017_ALREADY_MATERIALIZED'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json scripts/verify-api-evolution-v9.mjs scripts/verify-api-evolution-v10.mjs src/main/main.ts src/main/services/evolution-finding-service.ts src/main/services/evolution-finding-service.test.ts src/main/services/remixrota-service.ts src/main/services/remixrota-service.test.ts src/renderer/App.tsx src/renderer/RemixRotaWorkspace.tsx
          $staged = git diff --cached --name-only
          if (-not $staged) { throw 'V017_NO_PRODUCT_CHANGES_STAGED' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'V017_STAGED_DIFF_CHECK_FAILED' }
          git commit -m 'DevBox v0.1.17 runtime hardening'
          git push origin HEAD:codex/v0.1.17-final-runtime-hardening
