name: DevBox v0.1.10 final polish

on:
  push:
    branches:
      - codex/v0.1.10-canvas-workspace-agent

permissions:
  contents: write

concurrency:
  group: v0110-final-polish-single-writer
  cancel-in-progress: false

jobs:
  polish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.10-canvas-workspace-agent
          fetch-depth: 0
          persist-credentials: true

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Son kaynak düzeltmelerini uygula ve push et
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/v0110-final-polish.mjs
          if ($LASTEXITCODE -ne 0) { throw "V0110_FINAL_POLISH_FAILED:$LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "V0110_FINAL_POLISH_DIFF_FAILED:$LASTEXITCODE" }
          $changed = git diff --name-only -- src/renderer/App.tsx src/main/services/agent-service.ts
          if (-not $changed) { Write-Host 'V0110_FINAL_POLISH_ALREADY_APPLIED'; exit 0 }
          git config user.name 'DevBox CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/renderer/App.tsx src/main/services/agent-service.ts
          git commit -m 'v0.1.10 final Canvas workspace polish'
          git fetch origin codex/v0.1.10-canvas-workspace-agent
          git rebase origin/codex/v0.1.10-canvas-workspace-agent
          if ($LASTEXITCODE -ne 0) { throw "V0110_FINAL_POLISH_REBASE_FAILED:$LASTEXITCODE" }
          git push origin HEAD:codex/v0.1.10-canvas-workspace-agent
