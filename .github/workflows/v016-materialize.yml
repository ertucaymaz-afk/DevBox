name: DevBox v0.1.16 materialize

on:
  push:
    branches:
      - codex/v0.1.16-remixrota-light-ui-evolution-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devbox-v016-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/v0.1.16-remixrota-light-ui-evolution-fixes')
    runs-on: windows-2025
    steps:
      - name: Branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.16-remixrota-light-ui-evolution-fixes
          fetch-depth: 1
          persist-credentials: true
      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: v0.1.16 ürün wiring uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/apply-v016-ipc.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V016_IPC_MATERIALIZER_FAILED' }
          node scripts/apply-v016-ui.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V016_UI_MATERIALIZER_FAILED' }
          node scripts/apply-v016-evolution.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V016_EVOLUTION_MATERIALIZER_FAILED' }
          node scripts/apply-v016-evolution-fix.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V016_EVOLUTION_BOUNDARY_FIX_FAILED' }
          node scripts/apply-v016-verifier.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V016_VERIFIER_MATERIALIZER_FAILED' }
          node scripts/apply-v016-v9-fix.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V016_V9_FIX_MATERIALIZER_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'V016_GIT_DIFF_CHECK_FAILED' }
      - name: Tam ürün doğrulaması
        run: pnpm verify
      - name: Doğrulanmış ürün kaynaklarını dala yaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'V016_ALREADY_MATERIALIZED'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src package.json scripts/verify-api-evolution-v8.mjs scripts/verify-api-evolution-v9.mjs scripts/generate-app-icon.mjs build/icon.ico build/icon-master.png
          $staged = git diff --cached --name-only
          if (-not $staged) { throw 'V016_NO_PRODUCT_CHANGES_STAGED' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'V016_STAGED_DIFF_CHECK_FAILED' }
          git commit -m 'DevBox v0.1.16 product integration'
          git push origin HEAD:codex/v0.1.16-remixrota-light-ui-evolution-fixes
