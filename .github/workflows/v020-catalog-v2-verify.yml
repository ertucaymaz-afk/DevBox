name: DevBox v0.1.20 catalog v2 verification

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization

permissions:
  contents: write

concurrency:
  group: v020-catalog-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Catalog V2 route'unu exact etkinleştir
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/activate-v020-catalog-v2.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CATALOG_V2_ACTIVATION_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'CATALOG_V2_DIFF_CHECK_FAILED' }
          $main = Get-Content src/renderer/main.tsx -Raw
          if (-not $main.Contains('"./catalog-v2.css"')) { throw 'CATALOG_V2_CSS_LOAD_MISSING' }

      - name: Ürün kapılarını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }

      - name: Doğrulanmış App route'unu branch'e yaz
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- src/renderer/App.tsx
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'feat(ui): activate catalog workspace v2'
            git push origin HEAD:codex/v0.1.20-ui-runtime-stabilization
          }
