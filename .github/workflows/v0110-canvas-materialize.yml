name: DevBox v0.1.10 Canvas workspace materialization

on:
  push:
    branches:
      - codex/v0.1.10-canvas-workspace-agent
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0110-canvas-materialize-single-writer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.10-canvas-workspace-agent
          fetch-depth: 0
          persist-credentials: true

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Canvas ve workspace runtime onarımlarını uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/fix-v0110-materializer.mjs
          if ($LASTEXITCODE -ne 0) { throw "V0110_MATERIALIZER_REPAIR_FAILED:$LASTEXITCODE" }
          node --check scripts/apply-v0110-canvas-workspace.mjs
          if ($LASTEXITCODE -ne 0) { throw "V0110_MATERIALIZER_SYNTAX_FAILED:$LASTEXITCODE" }
          node scripts/apply-v0110-canvas-workspace.mjs
          if ($LASTEXITCODE -ne 0) { throw "V0110_MATERIALIZER_FAILED:$LASTEXITCODE" }
          node scripts/apply-v0110-followup.mjs
          if ($LASTEXITCODE -ne 0) { throw "V0110_FOLLOWUP_FAILED:$LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "V0110_DIFF_CHECK_FAILED:$LASTEXITCODE" }

      - name: Gerçek kaynak değişikliklerini commit et
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = git status --porcelain
          if (-not $changes) { Write-Host 'V0110_ALREADY_MATERIALIZED'; exit 0 }
          git config user.name 'DevBox CI'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json src/shared/contracts.ts src/shared/bridge.ts src/preload/preload.cts src/main/services/agent-service.ts src/main/services/workspace-turn-service.ts src/main/ipc.ts src/main/main.ts src/renderer/App.tsx src/renderer/AdvancedViews.tsx src/renderer/CanvasInspector.tsx src/renderer/styles.css
          git commit -m 'v0.1.10 Canvas workspace runtime materialize'
          git fetch origin codex/v0.1.10-canvas-workspace-agent
          git rebase origin/codex/v0.1.10-canvas-workspace-agent
          if ($LASTEXITCODE -ne 0) { throw "V0110_REBASE_FAILED:$LASTEXITCODE" }
          git push origin HEAD:codex/v0.1.10-canvas-workspace-agent
          if ($LASTEXITCODE -ne 0) { throw "V0110_PUSH_FAILED:$LASTEXITCODE" }
