name: DevBox v0.1.14 concurrency memory adaptive hardening

on:
  push:
    branches:
      - codex/v0.1.14-concurrency-memory-adaptive-evolution
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v014-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Bağımlılıkları kilitten kur
        run: pnpm install --frozen-lockfile
      - name: v0.1.14 ürün kaynağının materialize olduğunu doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw
          if ($pkg -notmatch '"version"\s*:\s*"0\.1\.14"') { throw 'DEVBOX_V014_PRODUCT_NOT_MATERIALIZED' }
          if (-not (Test-Path 'src/main/services/memory-service.ts')) { throw 'DEVBOX_V014_MEMORY_SOURCE_MISSING' }
          if (-not (Test-Path 'src/main/services/thread-turn-coordinator.ts')) { throw 'DEVBOX_V014_TURN_COORDINATOR_MISSING' }
          Write-Host 'DEVBOX_V014_MATERIALIZED_SOURCE_PRESENT'
      - name: Patch biçimini doğrula
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'GIT_DIFF_CHECK_FAILED' }
      - name: TypeScript kapısı
        run: pnpm typecheck
      - name: Regresyon testleri
        run: pnpm test
      - name: Üretim build ve truth audit
        run: pnpm build
