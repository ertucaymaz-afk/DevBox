name: DevBox v0.1.15 control plane hardening

on:
  push:
    branches:
      - codex/v0.1.15-control-plane-release-findings-theme
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v015-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile
      - name: v0.1.15 kaynaklarını fail-closed materialize et
        run: node scripts/apply-v015-control-plane.mjs
      - name: Patch biçimini doğrula
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'V015_GIT_DIFF_CHECK_FAILED' }
      - name: Eski ve yeni gerçeklik kapıları dahil tüm doğrulamayı çalıştır
        run: pnpm verify
      - name: Doğrulanmış ürün kaynaklarını dala yaz
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json scripts/verify-api-evolution-v8.mjs src/main src/shared src/preload src/renderer
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'V015_STAGED_DIFF_CHECK_FAILED' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'DEVBOX_V015_PRODUCT_ALREADY_COMMITTED'
            exit 0
          }
          git commit -m 'v0.1.15: DevAPI control plane, release findings and day mode'
          git push origin HEAD:codex/v0.1.15-control-plane-release-findings-theme
          Write-Host 'DEVBOX_V015_PRODUCT_COMMITTED'
