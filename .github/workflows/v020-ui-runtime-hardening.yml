name: DevBox v0.1.20 UI runtime hardening

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v020-ui-runtime-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile

      - name: Exact UI/runtime patchlerini uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/apply-v020-ui-runtime-stabilization.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UI_RUNTIME_MATERIALIZER_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'UI_RUNTIME_DIFF_CHECK_FAILED' }

      - name: Tüm ürün kapılarını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm spec:verify
          if ($LASTEXITCODE -ne 0) { throw 'SPEC_VERIFY_FAILED' }
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }

      - name: Doğrulanmış ürün kaynaklarını branch'e yaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'src/main/services/agent-service.ts',
            'src/main/services/agent-service.test.ts',
            'src/main/ipc.ts',
            'src/renderer/AdvancedViews.tsx',
            'src/renderer/RemixRotaWorkspace.tsx'
          )
          git add -- $paths
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'fix(ui): stabilize chat evolution and music runtime UX'
            git push origin HEAD:codex/v0.1.20-ui-runtime-stabilization
          }
