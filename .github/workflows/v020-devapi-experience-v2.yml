name: DevBox v0.1.20 DevAPI experience v2 verification

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization

permissions:
  contents: write

concurrency:
  group: v020-devapi-experience-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: DevAPI V2 güvenlik ve runtime patchlerini uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/apply-v020-devapi-experience-v2.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEVAPI_V2_MATERIALIZER_FAILED' }
          node scripts/extend-cloud-verifier-devapi-v2.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEVAPI_V2_VERIFIER_EXTENSION_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'DEVAPI_V2_DIFF_CHECK_FAILED' }
          node --check cloud/devapi-control/app.js
          if ($LASTEXITCODE -ne 0) { throw 'DEVAPI_APP_SYNTAX_FAILED' }
          node --check cloud/devapi-control/experience-v2.js
          if ($LASTEXITCODE -ne 0) { throw 'DEVAPI_EXPERIENCE_SYNTAX_FAILED' }

      - name: Cloud ve ürün kapılarını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm cloud:verify
          if ($LASTEXITCODE -ne 0) { throw 'CLOUD_VERIFY_FAILED' }
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }

      - name: Doğrulanmış DevAPI V2 kaynaklarını branch'e yaz
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- cloud/devapi-control/app.js cloud/devapi-control/index.html scripts/verify-cloud-ecosystem.mjs
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'feat(devapi): activate secure control-plane experience v2'
            git push origin HEAD:codex/v0.1.20-ui-runtime-stabilization
          }
