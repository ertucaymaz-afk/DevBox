name: DevBox v0.1.13 GIF runtime hardening

on:
  push:
    branches:
      - codex/v0.1.13-gif-runtime-hardening
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v013-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kilitten kur
        run: pnpm install --frozen-lockfile

      - name: Final API evolution izolasyonunu fail-closed uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/apply-v013-evolution-final2.mjs
          if ($LASTEXITCODE -ne 0) { throw "V013_EVOLUTION_FINAL2_FAILED:$LASTEXITCODE" }

      - name: Patch biçimini doğrula
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'GIT_DIFF_CHECK_FAILED' }

      - name: TypeScript kapısı
        run: pnpm typecheck

      - name: Regresyon testleri
        run: pnpm test

      - name: Üretim build ve truth audit
        run: pnpm build

      - name: Doğrulanmış ürün kaynaklarını dala yaz
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/services/api-evolution-service.ts
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'DEVBOX_V013_EVOLUTION_ALREADY_FINAL'
            exit 0
          }
          git commit -m 'v0.1.13: enforce continuous API evolution isolation'
          git push origin HEAD:codex/v0.1.13-gif-runtime-hardening
          Write-Host 'DEVBOX_V013_EVOLUTION_FINAL_COMMITTED'
