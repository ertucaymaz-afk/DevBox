name: DevBox v0.1.8 hardening v3
on:
  workflow_dispatch:
  push:
    paths:
      - .v018-harden-v3-trigger
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v0.1.8-direct-self-development
          fetch-depth: 0
          persist-credentials: true
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Rx([string]$p,[string]$o,[string]$n,[string]$c){$t=Get-Content $p -Raw;if(-not $t.Contains($o)){throw "$c"};Set-Content $p ($t.Replace($o,$n)) -Encoding utf8NoBOM -NoNewline}
          $s='src/main/services/development-spec-service.ts'
          Rx $s 'options: { ignoreRetryAfter?: boolean; allowBlockedExternalRetry?: boolean }' 'options: { ignoreRetryAfter?: boolean; allowBlockedExternalRetry?: boolean; allowRecoveryRetry?: boolean }' 'SPEC_OPTIONS'
          Rx $s 'if (state?.state === "RECOVERY_REQUIRED" || state?.state === "RUNNING") return null;' 'if (state?.state === "RUNNING") return null;`n      if (state?.state === "RECOVERY_REQUIRED") return options.allowRecoveryRetry ? task : null;' 'SPEC_RECOVERY'
          $a='src/main/services/api-evolution-service.ts'
          Rx $a 'this.#spec.next(projectId, { ignoreRetryAfter: manual, allowBlockedExternalRetry: manual })' 'this.#spec.next(projectId, { ignoreRetryAfter: manual, allowBlockedExternalRetry: manual, allowRecoveryRetry: manual })' 'API_RECOVERY'
          Rx $a 'let baselineFingerprint: string | null = null;' 'let baselineFingerprint: string | null = null;`n    let baselineHead: string | null = null;`n    let baselineWasClean = false;' 'API_BASELINE_FIELDS'
          $old='baselineFingerprint = await this.#workspaceFingerprint(project.rootPath, controller.signal);`n      if (!baselineFingerprint) throw new Error("EVOLUTION_REQUIRES_GIT_REPOSITORY");'
          $new='const baselineStatus = await this.#git.status(project.rootPath);`n      if (!baselineStatus.available) throw new Error(`EVOLUTION_REQUIRES_GIT_REPOSITORY:${baselineStatus.error ?? "NOT_A_GIT_REPOSITORY"}`);`n      if (!baselineStatus.head || !/^[a-f0-9]{40}$/u.test(baselineStatus.head)) throw new Error("EVOLUTION_BASELINE_HEAD_INVALID");`n      baselineHead = baselineStatus.head;`n      if (baselineStatus.changes.length > 0) throw new Error(`EVOLUTION_WORKSPACE_DIRTY_BASELINE:${baselineStatus.changes.slice(0, 12).map((item) => item.path).join(",")}`);`n      baselineWasClean = true;`n      baselineFingerprint = await this.#workspaceFingerprint(project.rootPath, controller.signal);`n      if (!baselineFingerprint) throw new Error("EVOLUTION_REQUIRES_GIT_REPOSITORY");'
          Rx $a $old $new 'API_CLEAN_BASELINE'
          $old='const verificationScripts = scripts.verify ? ["verify"] : ["typecheck", "test", "build"].filter((script) => Boolean(scripts[script]));'
          if(-not (Select-String -LiteralPath $a -SimpleMatch $old -Quiet)){
            $t=Get-Content $a -Raw
            $pattern='for \(const script of \["typecheck", "test"\] as const\) \{[\s\S]*?\n        \}'
            $rep='const verificationScripts = scripts.verify ? ["verify"] : ["typecheck", "test", "build"].filter((script) => Boolean(scripts[script]));`n        for (const script of verificationScripts) {`n          const command = commandFor(script);`n          const stage = script === "test" ? "TESTING" as const : "VERIFYING" as const;`n          const timeoutMs = script === "verify" ? 35 * 60_000 : script === "test" || script === "build" ? 20 * 60_000 : 8 * 60_000;`n          this.#publishByRoot(rootPath, { stage, kind: "command", message: `${packageManager} ${script} bağımsız doğrulaması çalışıyor.`, provider: null, model: null });`n          const result = await this.#runner.run({ executable: command.executable, args: command.args, cwd: rootPath, cancellation, timeoutMs, maxOutputBytes: 16 * 1024 * 1024 });`n          evidence.push(result.runId);`n          if (result.exitCode !== 0 || result.timedOut || result.truncated) return { ok: false, evidence, detail: `${script.toUpperCase()}_FAILED:${result.stderr.slice(0, 700) || result.stdout.slice(0, 700)}` };`n        }'
            $u=[regex]::Replace($t,$pattern,$rep,1);if($u -eq $t){throw 'VERIFY_BLOCK'};Set-Content $a $u -Encoding utf8NoBOM -NoNewline
          }
          $m='  #publishByRoot(rootPath: string, event:'
          $t=Get-Content $a -Raw
          if(-not $t.Contains('#restoreManagedWorkspace')){
            $method='  #isManagedWorkspace(rootPath: string): boolean {`n    const markerPath = path.join(rootPath, ".devbox-managed-source.json");`n    if (!existsSync(markerPath)) return false;`n    try { const marker = JSON.parse(readFileSync(markerPath, "utf8")) as Record<string, unknown>; return marker.product === "DevBox" && marker.purpose === "persistent-self-development-source" && marker.realityContract === "NO_FABRICATED_OR_REPRESENTATIVE_SUCCESS"; } catch { return false; }`n  }`n`n  async #restoreManagedWorkspace(rootPath: string, baselineHead: string): Promise<string[]> {`n    if (!this.#isManagedWorkspace(rootPath)) return [];`n    if (!/^[a-f0-9]{40}$/u.test(baselineHead)) throw new Error("EVOLUTION_ROLLBACK_BASELINE_SHA_INVALID");`n    const reset = await this.#runner.run({ executable: "git", args: ["-C", rootPath, "reset", "--hard", baselineHead], cwd: rootPath, timeoutMs: 120_000, maxOutputBytes: 2 * 1024 * 1024 });`n    if (reset.exitCode !== 0 || reset.timedOut || reset.truncated) throw new Error(`EVOLUTION_ROLLBACK_RESET_FAILED:${reset.stderr.slice(0, 500)}`);`n    const clean = await this.#runner.run({ executable: "git", args: ["-C", rootPath, "clean", "-fd"], cwd: rootPath, timeoutMs: 120_000, maxOutputBytes: 2 * 1024 * 1024 });`n    if (clean.exitCode !== 0 || clean.timedOut || clean.truncated) throw new Error(`EVOLUTION_ROLLBACK_CLEAN_FAILED:${clean.stderr.slice(0, 500)}`);`n    const status = await this.#git.status(rootPath);`n    if (!status.available || status.head !== baselineHead || status.changes.length !== 0) throw new Error("EVOLUTION_ROLLBACK_VERIFICATION_FAILED");`n    return [reset.runId, clean.runId, `rollback-head:${baselineHead}`];`n  }`n`n'
            if(-not $t.Contains($m)){throw 'RESTORE_ANCHOR'};$t=$t.Replace($m,$method+$m);Set-Content $a $t -Encoding utf8NoBOM -NoNewline
          }
          $t=Get-Content $a -Raw
          $old='const failedAt = new Date().toISOString(); const raw = error instanceof Error ? error.message : String(error); const message = raw.slice(0, 1_000); const cancelled = message.includes("EVOLUTION_CANCELLED") || controller.signal.aborted;'
          if($t.Contains($old)){$new='const failedAt = new Date().toISOString(); const raw = error instanceof Error ? error.message : String(error); let message = raw.slice(0, 1_000); const cancelled = message.includes("EVOLUTION_CANCELLED") || controller.signal.aborted;`n      let rollbackEvidence: string[] = [];`n      let rollbackFailed = false;`n      if (baselineWasClean && baselineHead) { try { rollbackEvidence = await this.#restoreManagedWorkspace(project.rootPath, baselineHead); } catch (rollbackError) { rollbackFailed = true; const rollbackMessage = rollbackError instanceof Error ? rollbackError.message : String(rollbackError); message = `${message} | EVOLUTION_ROLLBACK_FAILED:${rollbackMessage}`.slice(0, 1_000); } }';$t=$t.Replace($old,$new);$t=$t.Replace('const blocker = !cancelled && this.#isExternalBlocker(message);','const blocker = !cancelled && !rollbackFailed && this.#isExternalBlocker(message);');$t=$t.Replace('const recovery = !cancelled && !blocker && attempts >= MAX_AUTOMATIC_RETRIES;','const recovery = !cancelled && (rollbackFailed || message.includes("EVOLUTION_WORKSPACE_DIRTY_BASELINE") || message.includes("EVOLUTION_BASELINE_HEAD_INVALID") || (!blocker && attempts >= MAX_AUTOMATIC_RETRIES));');$t=$t.Replace('evidence: [durable.id], retryAfterAt','evidence: [durable.id, ...rollbackEvidence], retryAfterAt');$t=$t.Replace('...item.evidence, durable.id, ...phaseEvidence','...item.evidence, durable.id, ...rollbackEvidence, ...phaseEvidence');Set-Content $a $t -Encoding utf8NoBOM -NoNewline}
          $t=Get-Content $a -Raw
          $b='const blockedAt = new Date().toISOString(); const reason = response.blockReason ?? "Harici bağımlılık gerekli.";`n        const evidence = [durable.id, response.sessionId, ...response.evidence].slice(0, 40);'
          if($t.Contains($b)){$r='const blockedAt = new Date().toISOString(); const reason = response.blockReason ?? "Harici bağımlılık gerekli.";`n        const rollbackEvidence = baselineWasClean && baselineHead ? await this.#restoreManagedWorkspace(project.rootPath, baselineHead) : [];`n        const evidence = [durable.id, response.sessionId, ...response.evidence, ...rollbackEvidence].slice(0, 40);';$t=$t.Replace($b,$r);Set-Content $a $t -Encoding utf8NoBOM -NoNewline}
          Remove-Item '.github/workflows/harden-v018-v2.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/harden-v018-v3.yml' -Force
          Remove-Item '.v018-harden-v3-trigger' -Force -ErrorAction SilentlyContinue
          Remove-Item '.devbox-hardening-trigger.txt' -Force -ErrorAction SilentlyContinue
          git config user.name 'DevBox CI Hardener';git config user.email 'actions@users.noreply.github.com';git add -A;git commit -m 'v0.1.8: recovery rollback clean-baseline ve full verify [v018-hardened-v3]';git push origin HEAD:codex/v0.1.8-direct-self-development
