name: DevBox v0.1.20 UI v2 stage 2

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v020-ui-v2-stage2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Stage 2 exact patchleri uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/apply-v020-ui-v2-stage2.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UI_V2_STAGE2_MATERIALIZER_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'UI_V2_STAGE2_DIFF_FAILED' }
      - name: Ürün kapılarını çalıştır
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm spec:verify
          if ($LASTEXITCODE -ne 0) { throw 'SPEC_VERIFY_FAILED' }
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }
      - name: Doğrulanmış ürün kaynaklarını branch'e yaz
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'src/renderer/App.tsx',
            'src/renderer/AdvancedViews.tsx',
            'src/renderer/design-system-v2.css',
            'src/renderer/SettingsWorkspaceV2.tsx',
            'scripts/verify-api-evolution-v9.mjs'
          )
          git add -- $paths
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'fix(ui): complete system theme and settings v2 wiring'
            git push origin HEAD:codex/v0.1.20-ui-runtime-stabilization
          }
