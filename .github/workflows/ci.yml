name: DevBox doğrulama

on:
  push:
    branches:
      - main
      - codex/v0.1.7-real-self-evolution
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows kaynak ve gerçeklik doğrulaması
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: İncelenen kaynak kodu al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: v0.1.7 kaynak değişikliklerini bütünlük denetimiyle uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partPaths = 0..7 | ForEach-Object { ".devbox-build/patch.b64.part{0:D2}" -f $_ }
          foreach ($partPath in $partPaths) {
            if (-not (Test-Path -LiteralPath $partPath -PathType Leaf)) { throw "PATCH_PART_MISSING:$partPath" }
          }
          $encoded = ($partPaths | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join ''
          $gzipPath = '.devbox-build/devbox-v017.patch.gz'
          $patchPath = '.devbox-build/devbox-v017.patch'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $expectedGzipSha256 = 'd20e56c1f49589d489d4e92aba029219e898141f6031ea99a05d48158c30218f'
          $actualGzipSha256 = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualGzipSha256 -ne $expectedGzipSha256) { throw "PATCH_GZIP_SHA256_MISMATCH:$actualGzipSha256" }
          python -c "import gzip,pathlib; p=pathlib.Path(r'.devbox-build/devbox-v017.patch.gz'); pathlib.Path(r'.devbox-build/devbox-v017.patch').write_bytes(gzip.decompress(p.read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_GZIP_DECODE_FAILED' }
          $expectedPatchSha256 = '50c3f604eec27a53f0dd378abebb51a366b80fe4333edbf49aebda283fa9a2eb'
          $actualPatchSha256 = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPatchSha256 -ne $expectedPatchSha256) { throw "PATCH_SHA256_MISMATCH:$actualPatchSha256" }
          git apply --check --ignore-space-change $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_CHECK_FAILED' }
          git apply --ignore-space-change $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_APPLY_FAILED' }
          & '.devbox-build/apply-v017-type-hotfix.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'TYPE_HOTFIX_FAILED' }
          Remove-Item -Recurse -Force '.devbox-build'
          if ((Get-Content package.json -Raw) -notmatch '"version":\s*"0\.1\.7"') { throw 'VERSION_PATCH_NOT_APPLIED' }
          Write-Host "DEVBOX_PATCH_VERIFIED gzip=$actualGzipSha256 patch=$actualPatchSha256"

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile

      - name: 22 faz ve 3362 atomik görevi doğrula
        run: pnpm spec:verify

      - name: API gelişim V7 gerçeklik kapısını doğrula
        run: node scripts/verify-api-evolution-v7.mjs

      - name: TypeScript, test, build ve ürün doğruluk kapısı
        run: pnpm verify

  package:
    name: Windows DevBox-Setup.exe üret ve doğrula
    runs-on: windows-latest
    timeout-minutes: 50
    needs: verify
    steps:
      - name: İncelenen kaynak kodu al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: v0.1.7 kaynak değişikliklerini bütünlük denetimiyle uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partPaths = 0..7 | ForEach-Object { ".devbox-build/patch.b64.part{0:D2}" -f $_ }
          foreach ($partPath in $partPaths) {
            if (-not (Test-Path -LiteralPath $partPath -PathType Leaf)) { throw "PATCH_PART_MISSING:$partPath" }
          }
          $encoded = ($partPaths | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join ''
          $gzipPath = '.devbox-build/devbox-v017.patch.gz'
          $patchPath = '.devbox-build/devbox-v017.patch'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $expectedGzipSha256 = 'd20e56c1f49589d489d4e92aba029219e898141f6031ea99a05d48158c30218f'
          $actualGzipSha256 = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualGzipSha256 -ne $expectedGzipSha256) { throw "PATCH_GZIP_SHA256_MISMATCH:$actualGzipSha256" }
          python -c "import gzip,pathlib; p=pathlib.Path(r'.devbox-build/devbox-v017.patch.gz'); pathlib.Path(r'.devbox-build/devbox-v017.patch').write_bytes(gzip.decompress(p.read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_GZIP_DECODE_FAILED' }
          $expectedPatchSha256 = '50c3f604eec27a53f0dd378abebb51a366b80fe4333edbf49aebda283fa9a2eb'
          $actualPatchSha256 = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPatchSha256 -ne $expectedPatchSha256) { throw "PATCH_SHA256_MISMATCH:$actualPatchSha256" }
          git apply --check --ignore-space-change $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_CHECK_FAILED' }
          git apply --ignore-space-change $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_APPLY_FAILED' }
          & '.devbox-build/apply-v017-type-hotfix.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'TYPE_HOTFIX_FAILED' }
          Remove-Item -Recurse -Force '.devbox-build'
          if ((Get-Content package.json -Raw) -notmatch '"version":\s*"0\.1\.7"') { throw 'VERSION_PATCH_NOT_APPLIED' }
          Write-Host "DEVBOX_PATCH_VERIFIED gzip=$actualGzipSha256 patch=$actualPatchSha256"

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile

      - name: NSIS Windows kurucusunu üret
        run: |
          pnpm build
          pnpm dlx electron-builder@26.15.7 --config config/electron-builder.yml --win nsis

      - name: EXE yapısını ve özetini fail-closed doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item 'release/DevBox-Setup.exe' -ErrorAction Stop
          if ($installer.Length -lt 5MB) { throw "INSTALLER_TOO_SMALL: $($installer.Length)" }
          $stream = [IO.File]::OpenRead($installer.FullName)
          try {
            $b0 = $stream.ReadByte(); $b1 = $stream.ReadByte()
          } finally { $stream.Dispose() }
          if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw 'INSTALLER_NOT_PE_MZ' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DevBox-Setup.exe" | Set-Content 'release/DevBox-Setup.exe.sha256' -Encoding ascii
          Write-Host "DEVBOX_INSTALLER_VERIFIED bytes=$($installer.Length) sha256=$hash"

      - name: Gerçek Windows kurucusunu yükle
        uses: actions/upload-artifact@v6
        with:
          name: DevBox-v0.1.7-Windows-Installer
          path: |
            release/DevBox-Setup.exe
            release/DevBox-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
