name: DevBox doğrulama

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kaynak ve sözleşmeleri doğrula
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: İncelenen kaynak kodu al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Sabitlenmiş pnpm sürümünü etkinleştir
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile

      - name: Ürünü doğrula
        run: pnpm verify

  package:
    name: İmzasız inceleme paketini üret
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - name: İncelenen kaynak kodu al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Sabitlenmiş pnpm sürümünü etkinleştir
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile

      - name: Kurucuyu ve doğrulanmış yayın envanterini üret
        run: |
          pnpm package:installer
          pnpm release:prepare
          pnpm release:verify

      - name: İmzasız paketi inceleme için yükle
        uses: actions/upload-artifact@v6
        with:
          name: devbox-unsigned-${{ github.sha }}
          path: release/devbox-package/
          if-no-files-found: error
          retention-days: 14
