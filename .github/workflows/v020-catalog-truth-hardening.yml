name: DevBox v0.1.20 catalog truth hardening

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
    paths:
      - scripts/harden-v020-catalog-truth.mjs
      - .github/workflows/v020-catalog-truth-hardening.yml

permissions:
  contents: write

concurrency:
  group: v020-catalog-truth-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Exact branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Catalog truth patch'i exact uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/harden-v020-catalog-truth.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CATALOG_TRUTH_PATCH_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'CATALOG_TRUTH_DIFF_CHECK_FAILED' }

      - name: Catalog regresyon testini çalıştır
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec vitest run src/renderer/catalog-view-state.test.ts --config config/vitest.config.ts --maxWorkers=1 --no-file-parallelism
          if ($LASTEXITCODE -ne 0) { throw 'CATALOG_TRUTH_TEST_FAILED' }

      - name: Tam ürün kapısını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }

      - name: Doğrulanmış ürün patch'ini branch'e yaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- src/renderer/CatalogWorkspaceV2.tsx
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'fix(catalog): enforce fail-closed status precedence'
            git push origin HEAD:codex/v0.1.20-ui-runtime-stabilization
          }
