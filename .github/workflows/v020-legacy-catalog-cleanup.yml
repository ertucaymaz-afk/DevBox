name: DevBox v0.1.20 legacy catalog cleanup

on:
  push:
    branches:
      - codex/v0.1.20-ui-runtime-stabilization
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization

permissions:
  contents: write

concurrency:
  group: v020-legacy-catalog-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-ui-runtime-stabilization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Eski Catalog implementasyonunu exact temizle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/cleanup-v020-legacy-catalog.mjs
          if ($LASTEXITCODE -ne 0) { throw 'LEGACY_CATALOG_CLEANUP_FAILED' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'LEGACY_CATALOG_DIFF_CHECK_FAILED' }

      - name: Ürün kapılarını doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm cloud:verify
          if ($LASTEXITCODE -ne 0) { throw 'CLOUD_VERIFY_FAILED' }
          pnpm evolution:verify
          if ($LASTEXITCODE -ne 0) { throw 'EVOLUTION_VERIFY_FAILED' }
          pnpm verify
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_VERIFY_FAILED' }

      - name: Doğrulanmış cleanup'ı branch'e yaz
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- src/renderer/AdvancedViews.tsx
          if (-not (git diff --cached --quiet)) {
            git config user.name 'devbox-ci'
            git config user.email 'devbox-ci@users.noreply.github.com'
            git commit -m 'refactor(ui): remove legacy catalog implementation'
            git push origin HEAD:codex/v0.1.20-ui-runtime-stabilization
          }
