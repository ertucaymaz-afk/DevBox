name: v0.1.20 production promotion

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v0.1.20-vercel-production-modernization
    paths:
      - .github/workflows/v020-production-promote.yml
      - scripts/v020-production-promote.mjs
      - scripts/verify-v020-production-promoter.mjs
      - scripts/verify-production-evidence-v13.mjs
      - package.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v020-production-promote.yml
      - scripts/v020-production-promote.mjs
      - scripts/verify-v020-production-promoter.mjs
      - scripts/verify-production-evidence-v13.mjs
      - package.json

permissions:
  contents: read

concurrency:
  group: v020-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/v0.1.20-vercel-production-modernization'
    name: Vercel production gerçeklik ve promotion
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_CLI_VERSION: 58.4.0
      VERCEL_ORG_ID: team_PNUxk74M7XR8MFlKl676ZHlv
      DEVAPI_PROJECT_ID: prj_mJCrN5G6w4R32axSWYSLSuuAdmBz
      DEVAPI_CANONICAL_URL: https://devapi-virid.vercel.app
      DEVBOX_PROJECT_NAME: devbox

    steps:
      - name: Promotion kaynağını al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Production secret gerçeklik kapısı
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          DEVBOX_DATABASE_URL: ${{ secrets.DEVBOX_DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL_FALLBACK: ${{ secrets.NEON_DATABASE_URL }}
          DEVBOX_CONTROL_PLANE_TOKEN: ${{ secrets.DEVBOX_CONTROL_PLANE_TOKEN }}
          DEVBOX_CONTROL_ADMIN_TOKEN: ${{ secrets.DEVBOX_CONTROL_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          vercel_token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          database_url="${DEVBOX_DATABASE_URL:-${DATABASE_URL_FALLBACK:-${NEON_DATABASE_URL_FALLBACK:-}}}"
          [[ -n "$vercel_token" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "$database_url" ]] || missing+=(DEVBOX_DATABASE_URL)
          [[ ${#DEVBOX_CONTROL_PLANE_TOKEN} -ge 32 ]] || missing+=(DEVBOX_CONTROL_PLANE_TOKEN)
          [[ ${#DEVBOX_CONTROL_ADMIN_TOKEN} -ge 32 ]] || missing+=(DEVBOX_CONTROL_ADMIN_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            printf 'V020_PRODUCTION_BLOCKED_EXTERNAL missing-github-secrets=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          echo 'V020_PRODUCTION_SECRET_GATE_PASS values=masked scope=step-only'

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Source ve production promoter kontratını tekrar doğrula
        run: |
          pnpm spec:verify
          pnpm evolution:verify
          pnpm cloud:verify
          pnpm production:promoter:verify
          pnpm typecheck
          node --check scripts/v020-production-promote.mjs

      - name: DevAPI ve DevBox production promote
        id: promote
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          DEVBOX_DATABASE_URL: ${{ secrets.DEVBOX_DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL_FALLBACK: ${{ secrets.NEON_DATABASE_URL }}
          DEVBOX_CONTROL_PLANE_TOKEN: ${{ secrets.DEVBOX_CONTROL_PLANE_TOKEN }}
          DEVBOX_CONTROL_ADMIN_TOKEN: ${{ secrets.DEVBOX_CONTROL_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          export VERCEL_TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          export DATABASE_URL="${DEVBOX_DATABASE_URL:-${DATABASE_URL_FALLBACK:-${NEON_DATABASE_URL_FALLBACK:-}}}"
          exec node scripts/v020-production-promote.mjs

      - name: Secret-free promotion evidence JSON üret
        if: steps.promote.outcome == 'success'
        env:
          OUT_DEVAPI_PROJECT_ID: ${{ steps.promote.outputs.devapi_project_id }}
          OUT_DEVAPI_DEPLOYMENT_ID: ${{ steps.promote.outputs.devapi_deployment_id }}
          OUT_DEVAPI_DEPLOYMENT_URL: ${{ steps.promote.outputs.devapi_deployment_url }}
          OUT_DEVAPI_ROLLBACK_ID: ${{ steps.promote.outputs.devapi_rollback_id }}
          OUT_DEVAPI_PUBLIC_STATE_STATUS: ${{ steps.promote.outputs.devapi_public_state_status }}
          OUT_DEVBOX_PROJECT_ID: ${{ steps.promote.outputs.devbox_project_id }}
          OUT_DEVBOX_DEPLOYMENT_ID: ${{ steps.promote.outputs.devbox_deployment_id }}
          OUT_DEVBOX_DEPLOYMENT_URL: ${{ steps.promote.outputs.devbox_deployment_url }}
          OUT_DEVBOX_PRODUCT_URL: ${{ steps.promote.outputs.devbox_product_url }}
          OUT_DEVBOX_ROLLBACK_ID: ${{ steps.promote.outputs.devbox_rollback_id }}
          OUT_DEVBOX_PUBLIC_STATE_STATUS: ${{ steps.promote.outputs.devbox_public_state_status }}
          OUT_PUBLIC_STATE_CONTRACT: ${{ steps.promote.outputs.public_state_contract }}
          OUT_PUBLIC_STATE_SANITIZATION: ${{ steps.promote.outputs.public_state_sanitization }}
          OUT_CROSS_SITE_LINKS: ${{ steps.promote.outputs.cross_site_links }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const required = [
            'OUT_DEVAPI_PROJECT_ID','OUT_DEVAPI_DEPLOYMENT_ID','OUT_DEVAPI_DEPLOYMENT_URL','OUT_DEVAPI_ROLLBACK_ID','OUT_DEVAPI_PUBLIC_STATE_STATUS',
            'OUT_DEVBOX_PROJECT_ID','OUT_DEVBOX_DEPLOYMENT_ID','OUT_DEVBOX_DEPLOYMENT_URL','OUT_DEVBOX_PRODUCT_URL','OUT_DEVBOX_ROLLBACK_ID',
            'OUT_DEVBOX_PUBLIC_STATE_STATUS','OUT_PUBLIC_STATE_CONTRACT','OUT_PUBLIC_STATE_SANITIZATION','OUT_CROSS_SITE_LINKS'
          ];
          for (const name of required) if (!process.env[name]) throw new Error(`PROMOTION_EVIDENCE_OUTPUT_MISSING:${name}`);
          if (process.env.OUT_PUBLIC_STATE_CONTRACT !== 'PASS') throw new Error('PROMOTION_EVIDENCE_PUBLIC_STATE_CONTRACT_NOT_PASS');
          if (!['PASS','PENDING_DESKTOP_SNAPSHOT'].includes(process.env.OUT_PUBLIC_STATE_SANITIZATION)) {
            throw new Error(`PROMOTION_EVIDENCE_SANITIZATION_INVALID:${process.env.OUT_PUBLIC_STATE_SANITIZATION}`);
          }
          if (process.env.OUT_CROSS_SITE_LINKS !== 'PASS') throw new Error('PROMOTION_EVIDENCE_CROSS_LINKS_NOT_PASS');
          if (process.env.OUT_DEVAPI_DEPLOYMENT_ID === process.env.OUT_DEVAPI_ROLLBACK_ID) throw new Error('PROMOTION_EVIDENCE_DEVAPI_ROLLBACK_EQUALS_LIVE');
          if (process.env.OUT_DEVBOX_DEPLOYMENT_ID === process.env.OUT_DEVBOX_ROLLBACK_ID) throw new Error('PROMOTION_EVIDENCE_DEVBOX_ROLLBACK_EQUALS_LIVE');
          const report = {
            schemaVersion: 1,
            productVersion: '0.1.20',
            capturedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            state: 'PARTIAL_PASS_CANARY_PENDING',
            vercel: {
              teamId: process.env.VERCEL_ORG_ID,
              devapi: {
                projectId: process.env.OUT_DEVAPI_PROJECT_ID,
                deploymentId: process.env.OUT_DEVAPI_DEPLOYMENT_ID,
                deploymentUrl: process.env.OUT_DEVAPI_DEPLOYMENT_URL,
                rollbackCandidateId: process.env.OUT_DEVAPI_ROLLBACK_ID,
                canonicalUrl: process.env.DEVAPI_CANONICAL_URL,
                publicStateHttpStatus: Number(process.env.OUT_DEVAPI_PUBLIC_STATE_STATUS)
              },
              devbox: {
                projectId: process.env.OUT_DEVBOX_PROJECT_ID,
                deploymentId: process.env.OUT_DEVBOX_DEPLOYMENT_ID,
                deploymentUrl: process.env.OUT_DEVBOX_DEPLOYMENT_URL,
                rollbackCandidateId: process.env.OUT_DEVBOX_ROLLBACK_ID,
                productUrl: process.env.OUT_DEVBOX_PRODUCT_URL,
                publicStateHttpStatus: Number(process.env.OUT_DEVBOX_PUBLIC_STATE_STATUS)
              }
            },
            deploymentContract: {
              publicStateSanitization: process.env.OUT_PUBLIC_STATE_CONTRACT,
              crossSiteLinks: process.env.OUT_CROSS_SITE_LINKS
            },
            canary: {
              publicStateSanitization: process.env.OUT_PUBLIC_STATE_SANITIZATION,
              crossSiteLinks: process.env.OUT_CROSS_SITE_LINKS,
              desktopSnapshot: 'PENDING',
              setEnabledAck: 'PENDING',
              runAck: 'PENDING',
              cancelAck: 'PENDING',
              commandIdempotency: 'PENDING',
              commandSequence: 'PENDING',
              runtimeErrorScan: 'PENDING'
            }
          };
          mkdirSync('outputs', { recursive: true });
          writeFileSync('outputs/v020-production-promotion.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
          console.log(`V020_PROMOTION_EVIDENCE_JSON_PASS secrets=0 state=PARTIAL_PASS_CANARY_PENDING contract=${report.deploymentContract.publicStateSanitization} sanitizationCanary=${report.canary.publicStateSanitization} rollback=2`);
          NODE

      - name: Promotion evidence artifact yükle
        if: steps.promote.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: DevBox-v0.1.20-Production-Promotion-Evidence
          path: outputs/v020-production-promotion.json
          if-no-files-found: error
          retention-days: 14

      - name: Promotion özeti
        if: always()
        shell: bash
        run: |
          {
            echo '## DevBox v0.1.20 production promotion'
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- DevAPI deployment: \`${{ steps.promote.outputs.devapi_deployment_url || 'BLOCKED' }}\`"
            echo "- DevAPI rollback: \`${{ steps.promote.outputs.devapi_rollback_id || 'BLOCKED' }}\`"
            echo "- DevAPI public-state HTTP: \`${{ steps.promote.outputs.devapi_public_state_status || 'BLOCKED' }}\`"
            echo "- DevBox project: \`${{ steps.promote.outputs.devbox_project_id || 'BLOCKED' }}\`"
            echo "- DevBox deployment: \`${{ steps.promote.outputs.devbox_deployment_url || 'BLOCKED' }}\`"
            echo "- DevBox rollback: \`${{ steps.promote.outputs.devbox_rollback_id || 'BLOCKED' }}\`"
            echo "- DevBox verified product URL: \`${{ steps.promote.outputs.devbox_product_url || 'BLOCKED' }}\`"
            echo "- DevBox public-state proxy HTTP: \`${{ steps.promote.outputs.devbox_public_state_status || 'BLOCKED' }}\`"
            echo "- Public-state deployment contract: \`${{ steps.promote.outputs.public_state_contract || 'BLOCKED' }}\`"
            echo "- Public-state desktop sanitization canary: \`${{ steps.promote.outputs.public_state_sanitization || 'BLOCKED' }}\`"
            echo "- Cross-site links: \`${{ steps.promote.outputs.cross_site_links || 'BLOCKED' }}\`"
            echo '- Production evidence yalnız desktop snapshot + ACK canary gerçek PASS olduktan sonra PASS yapılacaktır.'
          } >> "$GITHUB_STEP_SUMMARY"
