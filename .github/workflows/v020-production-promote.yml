name: v0.1.20 production promotion

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v0.1.20-vercel-production-modernization
    paths:
      - .github/workflows/v020-production-promote.yml
      - scripts/v020-production-promote.mjs
      - scripts/verify-v020-production-promoter.mjs
      - scripts/v020-production-desktop-canary.mjs
      - scripts/verify-v020-desktop-canary.mjs
      - scripts/v020-vercel-runtime-scan.mjs
      - scripts/verify-production-evidence-v13.mjs
      - src/main/services/cloud-control-service.ts
      - src/main/services/cloud-control-idempotency.test.ts
      - cloud/devapi-control/lib/db.mjs
      - cloud/devapi-control/api/v1/snapshot.mjs
      - package.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v020-production-promote.yml
      - scripts/v020-production-promote.mjs
      - scripts/verify-v020-production-promoter.mjs
      - scripts/v020-production-desktop-canary.mjs
      - scripts/verify-v020-desktop-canary.mjs
      - scripts/v020-vercel-runtime-scan.mjs
      - scripts/verify-production-evidence-v13.mjs
      - src/main/services/cloud-control-service.ts
      - src/main/services/cloud-control-idempotency.test.ts
      - cloud/devapi-control/lib/db.mjs
      - cloud/devapi-control/api/v1/snapshot.mjs
      - package.json

permissions:
  contents: read

concurrency:
  group: v020-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/v0.1.20-vercel-production-modernization'
    name: Vercel production gerçeklik, desktop canary ve release kanıtı
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_CLI_VERSION: 58.4.0
      VERCEL_ORG_ID: team_PNUxk74M7XR8MFlKl676ZHlv
      DEVAPI_PROJECT_ID: prj_mJCrN5G6w4R32axSWYSLSuuAdmBz
      DEVAPI_CANONICAL_URL: https://devapi-virid.vercel.app
      DEVBOX_PROJECT_NAME: devbox

    steps:
      - name: Promotion kaynağını al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Production secret gerçeklik kapısı
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          DEVBOX_DATABASE_URL: ${{ secrets.DEVBOX_DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL_FALLBACK: ${{ secrets.NEON_DATABASE_URL }}
          DEVBOX_CONTROL_PLANE_TOKEN: ${{ secrets.DEVBOX_CONTROL_PLANE_TOKEN }}
          DEVBOX_CONTROL_ADMIN_TOKEN: ${{ secrets.DEVBOX_CONTROL_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          vercel_token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          database_url="${DEVBOX_DATABASE_URL:-${DATABASE_URL_FALLBACK:-${NEON_DATABASE_URL_FALLBACK:-}}}"
          [[ -n "$vercel_token" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "$database_url" ]] || missing+=(DEVBOX_DATABASE_URL)
          [[ ${#DEVBOX_CONTROL_PLANE_TOKEN} -ge 32 ]] || missing+=(DEVBOX_CONTROL_PLANE_TOKEN)
          [[ ${#DEVBOX_CONTROL_ADMIN_TOKEN} -ge 32 ]] || missing+=(DEVBOX_CONTROL_ADMIN_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            printf 'V020_PRODUCTION_BLOCKED_EXTERNAL missing-github-secrets=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi
          echo 'V020_PRODUCTION_SECRET_GATE_PASS values=masked scope=step-only'

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Source, promoter ve canary kontratını tekrar doğrula
        run: |
          pnpm spec:verify
          pnpm evolution:verify
          pnpm cloud:verify
          pnpm production:promoter:verify
          pnpm production:canary:verify
          pnpm test:cloud-idempotency
          pnpm typecheck
          node --check scripts/v020-production-promote.mjs

      - name: DevAPI ve DevBox production promote
        id: promote
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          DEVBOX_DATABASE_URL: ${{ secrets.DEVBOX_DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL_FALLBACK: ${{ secrets.NEON_DATABASE_URL }}
          DEVBOX_CONTROL_PLANE_TOKEN: ${{ secrets.DEVBOX_CONTROL_PLANE_TOKEN }}
          DEVBOX_CONTROL_ADMIN_TOKEN: ${{ secrets.DEVBOX_CONTROL_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          export VERCEL_TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          export DATABASE_URL="${DEVBOX_DATABASE_URL:-${DATABASE_URL_FALLBACK:-${NEON_DATABASE_URL_FALLBACK:-}}}"
          exec node scripts/v020-production-promote.mjs

      - name: Gerçek v0.1.20 desktop snapshot ve ACK canary
        id: canary
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        env:
          DEVBOX_CONTROL_ADMIN_TOKEN: ${{ secrets.DEVBOX_CONTROL_ADMIN_TOKEN }}
          DEVBOX_CANARY_PROJECT_ID: ${{ vars.DEVBOX_CANARY_PROJECT_ID }}
          DEVBOX_CANARY_MAX_AGE_SECONDS: 180
          DEVBOX_CANARY_WAIT_SECONDS: 480
        run: node scripts/v020-production-desktop-canary.mjs

      - name: Yeni deployment runtime error taraması
        id: runtime
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          DEVAPI_DEPLOYMENT_ID: ${{ steps.promote.outputs.devapi_deployment_id }}
          DEVBOX_PROJECT_ID: ${{ steps.promote.outputs.devbox_project_id }}
          DEVBOX_DEPLOYMENT_ID: ${{ steps.promote.outputs.devbox_deployment_id }}
        run: |
          set -euo pipefail
          export VERCEL_TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          exec node scripts/v020-vercel-runtime-scan.mjs

      - name: Secret-free birleşik production evidence JSON üret
        if: always() && steps.promote.outcome == 'success'
        env:
          OUT_DEVAPI_PROJECT_ID: ${{ steps.promote.outputs.devapi_project_id }}
          OUT_DEVAPI_DEPLOYMENT_ID: ${{ steps.promote.outputs.devapi_deployment_id }}
          OUT_DEVAPI_DEPLOYMENT_URL: ${{ steps.promote.outputs.devapi_deployment_url }}
          OUT_DEVAPI_ROLLBACK_ID: ${{ steps.promote.outputs.devapi_rollback_id }}
          OUT_DEVAPI_PUBLIC_STATE_STATUS: ${{ steps.promote.outputs.devapi_public_state_status }}
          OUT_DEVBOX_PROJECT_ID: ${{ steps.promote.outputs.devbox_project_id }}
          OUT_DEVBOX_DEPLOYMENT_ID: ${{ steps.promote.outputs.devbox_deployment_id }}
          OUT_DEVBOX_DEPLOYMENT_URL: ${{ steps.promote.outputs.devbox_deployment_url }}
          OUT_DEVBOX_PRODUCT_URL: ${{ steps.promote.outputs.devbox_product_url }}
          OUT_DEVBOX_ROLLBACK_ID: ${{ steps.promote.outputs.devbox_rollback_id }}
          OUT_DEVBOX_PUBLIC_STATE_STATUS: ${{ steps.promote.outputs.devbox_public_state_status }}
          OUT_PUBLIC_STATE_CONTRACT: ${{ steps.promote.outputs.public_state_contract }}
          OUT_CROSS_SITE_LINKS: ${{ steps.promote.outputs.cross_site_links }}
          OUT_CANARY_OUTCOME: ${{ steps.canary.outcome }}
          OUT_CANARY_PROJECT_ID: ${{ steps.canary.outputs.project_id }}
          OUT_DESKTOP_SNAPSHOT: ${{ steps.canary.outputs.desktop_snapshot }}
          OUT_PUBLIC_STATE_SANITIZATION: ${{ steps.canary.outputs.public_state_sanitization }}
          OUT_IDLE_ISOLATION: ${{ steps.canary.outputs.idle_isolation }}
          OUT_SET_ENABLED_ACK: ${{ steps.canary.outputs.set_enabled_ack }}
          OUT_RUN_ACK: ${{ steps.canary.outputs.run_ack }}
          OUT_CANCEL_ACK: ${{ steps.canary.outputs.cancel_ack }}
          OUT_COMMAND_SEQUENCE: ${{ steps.canary.outputs.command_sequence }}
          OUT_COMMAND_IDEMPOTENCY: ${{ steps.canary.outputs.command_idempotency }}
          OUT_RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          OUT_RUNTIME_ERROR_SCAN: ${{ steps.runtime.outputs.runtime_error_scan }}
          OUT_RUNTIME_ERROR_CLUSTERS: ${{ steps.runtime.outputs.runtime_error_clusters }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const requiredPromotion = [
            'OUT_DEVAPI_PROJECT_ID','OUT_DEVAPI_DEPLOYMENT_ID','OUT_DEVAPI_DEPLOYMENT_URL','OUT_DEVAPI_ROLLBACK_ID','OUT_DEVAPI_PUBLIC_STATE_STATUS',
            'OUT_DEVBOX_PROJECT_ID','OUT_DEVBOX_DEPLOYMENT_ID','OUT_DEVBOX_DEPLOYMENT_URL','OUT_DEVBOX_PRODUCT_URL','OUT_DEVBOX_ROLLBACK_ID',
            'OUT_DEVBOX_PUBLIC_STATE_STATUS','OUT_PUBLIC_STATE_CONTRACT','OUT_CROSS_SITE_LINKS'
          ];
          for (const name of requiredPromotion) if (!process.env[name]) throw new Error(`PROMOTION_EVIDENCE_OUTPUT_MISSING:${name}`);
          if (process.env.OUT_PUBLIC_STATE_CONTRACT !== 'PASS') throw new Error('PROMOTION_EVIDENCE_PUBLIC_STATE_CONTRACT_NOT_PASS');
          if (process.env.OUT_CROSS_SITE_LINKS !== 'PASS') throw new Error('PROMOTION_EVIDENCE_CROSS_LINKS_NOT_PASS');
          if (process.env.OUT_DEVAPI_DEPLOYMENT_ID === process.env.OUT_DEVAPI_ROLLBACK_ID) throw new Error('PROMOTION_EVIDENCE_DEVAPI_ROLLBACK_EQUALS_LIVE');
          if (process.env.OUT_DEVBOX_DEPLOYMENT_ID === process.env.OUT_DEVBOX_ROLLBACK_ID) throw new Error('PROMOTION_EVIDENCE_DEVBOX_ROLLBACK_EQUALS_LIVE');

          const canaryPass = process.env.OUT_CANARY_OUTCOME === 'success' && [
            'OUT_DESKTOP_SNAPSHOT','OUT_PUBLIC_STATE_SANITIZATION','OUT_IDLE_ISOLATION','OUT_SET_ENABLED_ACK','OUT_RUN_ACK','OUT_CANCEL_ACK','OUT_COMMAND_SEQUENCE','OUT_COMMAND_IDEMPOTENCY'
          ].every((name) => process.env[name] === 'PASS');
          const runtimePass = process.env.OUT_RUNTIME_OUTCOME === 'success' && process.env.OUT_RUNTIME_ERROR_SCAN === 'PASS' && Number(process.env.OUT_RUNTIME_ERROR_CLUSTERS) === 0;
          const releaseCandidate = canaryPass && runtimePass;
          const report = {
            schemaVersion: 2,
            productVersion: '0.1.20',
            capturedAt: new Date().toISOString(),
            sourceSha: process.env.GITHUB_SHA,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            state: releaseCandidate ? 'PASS_RELEASE_EVIDENCE_CANDIDATE' : 'BLOCKED_CANARY_OR_RUNTIME',
            vercel: {
              teamId: process.env.VERCEL_ORG_ID,
              devapi: {
                projectId: process.env.OUT_DEVAPI_PROJECT_ID,
                deploymentId: process.env.OUT_DEVAPI_DEPLOYMENT_ID,
                deploymentUrl: process.env.OUT_DEVAPI_DEPLOYMENT_URL,
                rollbackCandidateId: process.env.OUT_DEVAPI_ROLLBACK_ID,
                canonicalUrl: process.env.DEVAPI_CANONICAL_URL,
                publicStateHttpStatus: Number(process.env.OUT_DEVAPI_PUBLIC_STATE_STATUS)
              },
              devbox: {
                projectId: process.env.OUT_DEVBOX_PROJECT_ID,
                deploymentId: process.env.OUT_DEVBOX_DEPLOYMENT_ID,
                deploymentUrl: process.env.OUT_DEVBOX_DEPLOYMENT_URL,
                rollbackCandidateId: process.env.OUT_DEVBOX_ROLLBACK_ID,
                productUrl: process.env.OUT_DEVBOX_PRODUCT_URL,
                publicStateHttpStatus: Number(process.env.OUT_DEVBOX_PUBLIC_STATE_STATUS)
              }
            },
            deploymentContract: {
              publicStateSanitization: process.env.OUT_PUBLIC_STATE_CONTRACT,
              crossSiteLinks: process.env.OUT_CROSS_SITE_LINKS
            },
            desktop: {
              projectId: process.env.OUT_CANARY_PROJECT_ID || null,
              version: canaryPass ? '0.1.20' : null,
              protocol: canaryPass ? 1 : null
            },
            canary: {
              desktopSnapshot: process.env.OUT_DESKTOP_SNAPSHOT || 'BLOCKED',
              publicStateSanitization: process.env.OUT_PUBLIC_STATE_SANITIZATION || 'BLOCKED',
              idleIsolation: process.env.OUT_IDLE_ISOLATION || 'BLOCKED',
              setEnabledAck: process.env.OUT_SET_ENABLED_ACK || 'BLOCKED',
              runAck: process.env.OUT_RUN_ACK || 'BLOCKED',
              cancelAck: process.env.OUT_CANCEL_ACK || 'BLOCKED',
              commandIdempotency: process.env.OUT_COMMAND_IDEMPOTENCY || 'BLOCKED',
              commandSequence: process.env.OUT_COMMAND_SEQUENCE || 'BLOCKED',
              crossSiteLinks: process.env.OUT_CROSS_SITE_LINKS,
              runtimeErrorScan: process.env.OUT_RUNTIME_ERROR_SCAN || 'BLOCKED'
            },
            proof: {
              cloudCommandIdempotencyFaultInjection: 'PASS',
              desktopIdleIsolation: process.env.OUT_IDLE_ISOLATION || 'BLOCKED',
              runtimeErrorClusters: Number(process.env.OUT_RUNTIME_ERROR_CLUSTERS || -1),
              canaryStepOutcome: process.env.OUT_CANARY_OUTCOME || 'skipped',
              runtimeStepOutcome: process.env.OUT_RUNTIME_OUTCOME || 'skipped'
            }
          };
          mkdirSync('outputs', { recursive: true });
          writeFileSync('outputs/v020-production-promotion.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
          console.log(`V020_PRODUCTION_EVIDENCE_JSON_PASS secrets=0 state=${report.state} canary=${canaryPass} runtime=${runtimePass}`);
          NODE

      - name: Production evidence artifact yükle
        if: always() && steps.promote.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: DevBox-v0.1.20-Production-Evidence
          path: |
            outputs/v020-production-promotion.json
            outputs/v020-desktop-canary.json
            outputs/v020-runtime-scan.json
          if-no-files-found: error
          retention-days: 14

      - name: Release evidence final kapısı
        if: always() && steps.promote.outcome == 'success'
        shell: bash
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          DESKTOP_SNAPSHOT: ${{ steps.canary.outputs.desktop_snapshot }}
          PUBLIC_STATE_SANITIZATION: ${{ steps.canary.outputs.public_state_sanitization }}
          IDLE_ISOLATION: ${{ steps.canary.outputs.idle_isolation }}
          SET_ENABLED_ACK: ${{ steps.canary.outputs.set_enabled_ack }}
          RUN_ACK: ${{ steps.canary.outputs.run_ack }}
          CANCEL_ACK: ${{ steps.canary.outputs.cancel_ack }}
          COMMAND_SEQUENCE: ${{ steps.canary.outputs.command_sequence }}
          COMMAND_IDEMPOTENCY: ${{ steps.canary.outputs.command_idempotency }}
          RUNTIME_ERROR_SCAN: ${{ steps.runtime.outputs.runtime_error_scan }}
        run: |
          set -euo pipefail
          [[ "$CANARY_OUTCOME" == success ]] || { echo "V020_RELEASE_BLOCKED desktop-canary-outcome=$CANARY_OUTCOME"; exit 1; }
          [[ "$RUNTIME_OUTCOME" == success ]] || { echo "V020_RELEASE_BLOCKED runtime-scan-outcome=$RUNTIME_OUTCOME"; exit 1; }
          for value in "$DESKTOP_SNAPSHOT" "$PUBLIC_STATE_SANITIZATION" "$IDLE_ISOLATION" "$SET_ENABLED_ACK" "$RUN_ACK" "$CANCEL_ACK" "$COMMAND_SEQUENCE" "$COMMAND_IDEMPOTENCY" "$RUNTIME_ERROR_SCAN"; do
            [[ "$value" == PASS ]] || { echo "V020_RELEASE_BLOCKED evidence-value=${value:-missing}"; exit 1; }
          done
          echo 'V020_RELEASE_EVIDENCE_CANDIDATE_PASS deployment=verified desktop=real-ack idleIsolation=pass publicState=sanitized runtimeErrors=0'

      - name: Promotion özeti
        if: always()
        shell: bash
        run: |
          {
            echo '## DevBox v0.1.20 production promotion'
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- DevAPI deployment: \`${{ steps.promote.outputs.devapi_deployment_url || 'BLOCKED' }}\`"
            echo "- DevAPI rollback: \`${{ steps.promote.outputs.devapi_rollback_id || 'BLOCKED' }}\`"
            echo "- DevAPI public-state HTTP: \`${{ steps.promote.outputs.devapi_public_state_status || 'BLOCKED' }}\`"
            echo "- DevBox project: \`${{ steps.promote.outputs.devbox_project_id || 'BLOCKED' }}\`"
            echo "- DevBox deployment: \`${{ steps.promote.outputs.devbox_deployment_url || 'BLOCKED' }}\`"
            echo "- DevBox rollback: \`${{ steps.promote.outputs.devbox_rollback_id || 'BLOCKED' }}\`"
            echo "- DevBox verified product URL: \`${{ steps.promote.outputs.devbox_product_url || 'BLOCKED' }}\`"
            echo "- Public-state deployment contract: \`${{ steps.promote.outputs.public_state_contract || 'BLOCKED' }}\`"
            echo "- Cross-site links: \`${{ steps.promote.outputs.cross_site_links || 'BLOCKED' }}\`"
            echo "- Real desktop canary outcome: \`${{ steps.canary.outcome || 'BLOCKED' }}\`"
            echo "- Desktop snapshot: \`${{ steps.canary.outputs.desktop_snapshot || 'BLOCKED' }}\`"
            echo "- Public-state sanitization: \`${{ steps.canary.outputs.public_state_sanitization || 'BLOCKED' }}\`"
            echo "- Idle isolation: \`${{ steps.canary.outputs.idle_isolation || 'BLOCKED' }}\`"
            echo "- setEnabled/run/cancel ACK: \`${{ steps.canary.outputs.set_enabled_ack || 'BLOCKED' }}/${{ steps.canary.outputs.run_ack || 'BLOCKED' }}/${{ steps.canary.outputs.cancel_ack || 'BLOCKED' }}\`"
            echo "- Command idempotency/sequence: \`${{ steps.canary.outputs.command_idempotency || 'BLOCKED' }}/${{ steps.canary.outputs.command_sequence || 'BLOCKED' }}\`"
            echo "- Runtime error scan: \`${{ steps.runtime.outputs.runtime_error_scan || 'BLOCKED' }}\`"
            echo '- Repository productionEvidence yalnız birleşik artifact repo evidence dosyasına doğrulanarak taşındıktan sonra PASS yapılacaktır.'
          } >> "$GITHUB_STEP_SUMMARY"
