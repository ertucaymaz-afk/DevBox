name: DevBox v0.1.8 kaynak materializasyonu

on:
  push:
    branches:
      - codex/v0.1.8-direct-self-development

permissions:
  contents: write

concurrency:
  group: materialize-v018
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[v018-materialized]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Dalı yazılabilir olarak al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.8-direct-self-development
          fetch-depth: 0
          persist-credentials: true

      - name: İncelenmiş v0.1.7 patchini doğrudan kaynaklara uygula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partPaths = 0..7 | ForEach-Object { ".devbox-build/patch.b64.part{0:D2}" -f $_ }
          foreach ($partPath in $partPaths) {
            if (-not (Test-Path -LiteralPath $partPath -PathType Leaf)) { throw "PATCH_PART_MISSING:$partPath" }
          }
          $encoded = ($partPaths | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join ''
          $gzipPath = '.devbox-build/devbox-v017.patch.gz'
          $patchPath = '.devbox-build/devbox-v017.patch'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $expectedGzipSha256 = 'd20e56c1f49589d489d4e92aba029219e898141f6031ea99a05d48158c30218f'
          $actualGzipSha256 = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualGzipSha256 -ne $expectedGzipSha256) { throw "PATCH_GZIP_SHA256_MISMATCH:$actualGzipSha256" }
          python -c "import gzip,pathlib; p=pathlib.Path(r'.devbox-build/devbox-v017.patch.gz'); pathlib.Path(r'.devbox-build/devbox-v017.patch').write_bytes(gzip.decompress(p.read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_GZIP_DECODE_FAILED' }
          $expectedPatchSha256 = '50c3f604eec27a53f0dd378abebb51a366b80fe4333edbf49aebda283fa9a2eb'
          $actualPatchSha256 = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPatchSha256 -ne $expectedPatchSha256) { throw "PATCH_SHA256_MISMATCH:$actualPatchSha256" }
          git apply --check --ignore-space-change $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_CHECK_FAILED' }
          git apply --ignore-space-change $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'PATCH_APPLY_FAILED' }
          & '.devbox-build/apply-v017-type-hotfix.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'TYPE_HOTFIX_FAILED' }

          $package = Get-Content 'package.json' -Raw
          if ($package -notmatch '"version":\s*"0\.1\.7"') { throw 'V017_VERSION_NOT_MATERIALIZED' }
          $package = $package -replace '"version":\s*"0\.1\.7"', '"version": "0.1.8"'
          Set-Content 'package.json' -Value $package -Encoding utf8NoBOM -NoNewline

          Remove-Item -Recurse -Force '.devbox-build'
          Remove-Item -Force '.github/workflows/materialize-v018.yml'
          if (Test-Path '.devbox-build') { throw 'BUILD_PATCH_DIRECTORY_STILL_PRESENT' }
          if ((Get-Content package.json -Raw) -notmatch '"version":\s*"0\.1\.8"') { throw 'V018_VERSION_NOT_SET' }
          Write-Host "DEVBOX_SOURCE_MATERIALIZED gzip=$actualGzipSha256 patch=$actualPatchSha256 version=0.1.8"

      - name: Materialize edilen kaynakları tek commit olarak yaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'DevBox CI Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if (-not (git status --porcelain)) { throw 'MATERIALIZATION_PRODUCED_NO_CHANGES' }
          git commit -m 'v0.1.8: v0.1.7 çalışma zamanı kaynaklarını doğrudan materialize et [v018-materialized]'
          git push origin HEAD:codex/v0.1.8-direct-self-development
