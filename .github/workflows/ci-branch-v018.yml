name: DevBox v0.1.8 PR doğrulama

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  verify-v018:
    if: ${{ github.head_ref == 'codex/v0.1.8-direct-self-development' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:verify
      - run: pnpm evolution:verify
      - run: pnpm verify
