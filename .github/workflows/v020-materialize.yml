name: v0.1.20 source materialize hardening

on:
  push:
    branches:
      - codex/v0.1.20-vercel-production-modernization
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v020-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/v0.1.20-vercel-production-modernization'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: v0.1.20 branch kaynağını al
        uses: actions/checkout@v6
        with:
          ref: codex/v0.1.20-vercel-production-modernization
          fetch-depth: 0

      - name: pnpm 11.19.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Node.js 24 kullan
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Kilitli bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: v0.1.20 ürün kaynaklarını fail-closed materialize et
        run: node scripts/apply-v020-source-bundle.mjs

      - name: Diff bütünlüğünü doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'V020_DIFF_CHECK_FAILED' }
          $changed = git status --porcelain
          if (-not $changed) { throw 'V020_NO_PRODUCT_CHANGE' }
          Write-Host $changed

      - name: v13, cloud, TypeScript, test, build ve truth kapısı
        run: pnpm verify

      - name: Production gate'in gerçek blocker nedeniyle kapalı olduğunu doğrula
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& node scripts/verify-production-evidence-v13.mjs 2>&1)
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -eq 0) { throw 'V020_PRODUCTION_GATE_FALSE_PASS' }
          $text = $output -join "`n"
          if ($text -notmatch 'PRODUCTION_EVIDENCE_V13_FAIL') { throw 'V020_PRODUCTION_GATE_UNEXPECTED_FAILURE' }
          if ($text -notmatch 'BLOCKED') { throw 'V020_PRODUCTION_GATE_BLOCKER_NOT_REPORTED' }
          Write-Host 'V020_PRODUCTION_GATE_EXPECTED_BLOCKED PASS'

      - name: Doğrulanmış ürün kaynaklarını branch'e yaz
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'devbox-v020-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md package.json cloud docs scripts/verify-cloud-ecosystem.mjs scripts/verify-api-evolution-v12.mjs scripts/verify-api-evolution-v13.mjs scripts/verify-production-evidence-v13.mjs src/shared/contracts.ts src/main/services/api-evolution-service.ts src/main/services/api-evolution-v13-tracks.test.ts src/main/services/database.test.ts
          git reset -- scripts/apply-v020-source-bundle.mjs scripts/apply-v020-evolution-tracks.mjs .github/workflows/v020-materialize.yml 2>$null
          if (-not (git diff --cached --quiet)) {
            git commit -m 'DevBox v0.1.20 source, sites, v13 and evidence contract'
            git push origin HEAD:codex/v0.1.20-vercel-production-modernization
          } else {
            Write-Host 'V020_PRODUCT_ALREADY_MATERIALIZED'
          }
