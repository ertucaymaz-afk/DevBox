name: DevAPI autonomous evolution v2

on:
  push:
    branches:
      - codex/devapi-autonomous-evolution-v1
    paths:
      - cloud/devapi-control/**
      - scripts/build-devapi-repo-inventory.mjs
      - scripts/devapi-agent-worker-smoke.mjs
      - scripts/devapi-worktree-smoke.mjs
      - scripts/verify-devapi-autonomous-v1.mjs
      - scripts/verify-devapi-autonomous-v2.mjs
      - .github/workflows/devapi-autonomous-evolution.yml
  pull_request:
    branches:
      - codex/v0.1.20-vercel-production-modernization
    paths:
      - cloud/devapi-control/**
      - scripts/build-devapi-repo-inventory.mjs
      - scripts/devapi-agent-worker-smoke.mjs
      - scripts/devapi-worktree-smoke.mjs
      - scripts/verify-devapi-autonomous-v1.mjs
      - scripts/verify-devapi-autonomous-v2.mjs
      - .github/workflows/devapi-autonomous-evolution.yml

permissions:
  contents: read

concurrency:
  group: devapi-autonomous-evolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: task + worker + worktree + agent + contract truth gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check cloud/devapi-control/agent/tool-registry.mjs
          node --check cloud/devapi-control/agent/task-policy.mjs
          node --check cloud/devapi-control/agent/task-state.mjs
          node --check cloud/devapi-control/agent/runtime.mjs
          node --check cloud/devapi-control/research/evidence.mjs
          node --check cloud/devapi-control/lib/openai-web-research.mjs
          node --check cloud/devapi-control/lib/agent-store.mjs
          node --check cloud/devapi-control/worker/workspace.mjs
          node --check cloud/devapi-control/worker/git-worktree.mjs
          node --check cloud/devapi-control/api/v1/agent-capabilities.mjs
          node --check cloud/devapi-control/api/v1/agent-research.mjs
          node --check cloud/devapi-control/api/v1/agent-runtime.mjs
          node --check cloud/devapi-control/api/v1/agent-tasks.mjs
          node --check scripts/build-devapi-repo-inventory.mjs
          node --check scripts/devapi-agent-worker-smoke.mjs
          node --check scripts/devapi-worktree-smoke.mjs
          node --check scripts/verify-devapi-autonomous-v1.mjs
          node --check scripts/verify-devapi-autonomous-v2.mjs

      - name: Build real repository inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-devapi-repo-inventory.mjs
          test -s outputs/devapi-repo-inventory.json

      - name: Execute real isolated worker smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/devapi-agent-worker-smoke.mjs
          test -s outputs/devapi-worker-smoke.json

      - name: Execute real git worktree smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/devapi-worktree-smoke.mjs
          test -s outputs/devapi-worktree-smoke.json
          git worktree list --porcelain

      - name: Autonomous v1 regression verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-devapi-autonomous-v1.mjs

      - name: Autonomous v2 task and worker verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-devapi-autonomous-v2.mjs

      - name: Existing cloud regression gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-cloud-ecosystem.mjs

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Upload source and worker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DevAPI-Autonomous-Evolution-v2-Evidence
          path: |
            outputs/devapi-repo-inventory.json
            outputs/devapi-worker-smoke.json
            outputs/devapi-worktree-smoke.json
            cloud/devapi-control/agent/dependency-manifest.json
          if-no-files-found: error
          retention-days: 14
